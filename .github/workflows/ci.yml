name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: ${{ matrix.env }}

      - name: Unit tests
        run: pixi run -e ${{ matrix.env }} test

      - name: Fetch smoke weights + parity samples (HuggingFace)
        run: |
          mkdir -p data
          for f in weights.lft sample_0.lft sample_1.lft sample_2.lft; do
            curl -sSfL "https://huggingface.co/mseritan/LabelFormer-AV2-smoke/resolve/main/mojo/$f" -o "data/$f"
          done

      - name: Inference parity vs PyTorch
        run: |
          pixi run -e ${{ matrix.env }} infer | tee infer.log
          grep -q "PARITY: PASS" infer.log
